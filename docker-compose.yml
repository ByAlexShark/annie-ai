services:
  db:
    image: postgres:16
    container_name: annie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: annie_db
      POSTGRES_USER: annie
      POSTGRES_PASSWORD: annie_password
    ports:
      - "5432:5432"
    volumes:
      - annie_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annie -d annie_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  annie_postgres_data:
